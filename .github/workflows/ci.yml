name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    name: Syntax · Imports · Links · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Repo-Checks (Syntax, Imports, Markdown-Links)
        run: bun run check

      - name: Build (Root + Workspaces)
        run: bun run build
